<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>سوپرادمین نورا</title>
  <link rel="icon" href="/assets/img/neura-logo-gradient.png">
  <link rel="stylesheet" href="/assets/fa/css/all.min.css">
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form class="box" id="loginForm">
      <img src="/assets/img/neura-logo-gradient.png" alt="" width="56" height="56">
      <h1>سوپرادمین نورا</h1>
      <label>نام کاربری<input name="user" autocomplete="username" required></label>
      <label>رمز عبور<input name="pass" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">ورود</button>
      <p class="err" id="loginErr"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="brand"><img src="/assets/img/neura-logo-gradient.png" alt="" width="34" height="34"><b>سوپرادمین</b></div>
      <nav id="tabs"></nav>
      <div class="side-foot">
        <a class="btn ghost" href="/" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i>مشاهدهٔ سایت</a>
        <button class="btn ghost" id="logout"><i class="fa-solid fa-right-from-bracket"></i>خروج</button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <button class="btn ghost menu-btn" id="menuBtn" aria-label="منو"><i class="fa-solid fa-bars"></i></button>
        <h2 id="secTitle"></h2>
        <span class="status" id="status"></span>
        <button class="btn primary" id="save"><i class="fa-solid fa-floppy-disk"></i>ذخیره</button>
      </header>
      <div id="panel" class="panel"></div>
    </main>
  </div>
  <script src="/admin/static/admin.js"></script>
</body>
</html>
